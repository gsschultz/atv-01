<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Troco</title>
</head>
<body>
    <h1>Vendedores da mercearia</h1>

    <p>Calcule o valor de sua compra!</p>

    <div id="preco">
        <label for="preco">Preço unitário do produto:</label>
        <input type="number" id="preco" placeholder="Digite aqui o preço">
    </div>

    <div id="qntd">
        <label for="quantidade">Quantidade de produtos:</label>
        <input type="number" id="quantidade" placeholder="Digite aqui a quantidade">
    </div>

    <div id="valor">
        <label for="valor">Dinheiro recebido:</label>
        <input type="number" id="valor" placeholder="Digite aqui o valor recebido">
    </div>

    <button>Calcular</button>

    <p id="resultado"></p>

</body>
</html>
